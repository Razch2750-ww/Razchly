<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Fix for sandbox/iframe environments where window.fetch has only a getter
      (function() {
        try {
          const originalFetch = window.fetch;
          let customFetch = originalFetch;
          
          Object.defineProperty(window, 'fetch', {
            get() {
              return customFetch;
            },
            set(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not redefine window.fetch directly, attempting proxy fallback...", e);
          try {
            let customFetch = window.fetch;
            const originalGlobalThis = window.globalThis || window;
            const handler = {
              get(target, prop) {
                if (prop === 'fetch') return customFetch;
                const value = Reflect.get(target, prop);
                if (typeof value === 'function') {
                  return value.bind(target);
                }
                return value;
              },
              set(target, prop, value) {
                if (prop === 'fetch') {
                  customFetch = value;
                  return true;
                }
                return Reflect.set(target, prop, value);
              }
            };
            const proxy = new Proxy(originalGlobalThis, handler);
            Object.defineProperty(window, 'globalThis', {
              value: proxy,
              configurable: true,
              writable: true
            });
          } catch (err2) {
            console.error("Failed to apply all fetch getter bypasses:", err2);
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Razchly adalah asisten keuangan pribadi, pelacakan investasi multi-aset, simulasi trading AI, dan pengelola produktivitas Grab Partner dalam satu dashboard terintegrasi." />
    <title>Razchly — Ekosistem Keuangan & Asisten Produktivitas AI</title>
    
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- PWA meta tags -->
    <meta name="theme-color" content="#0D0E0C" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>
  <body>
    <div id="root">
      <style>
        :root { color-scheme: dark; }
        body { margin: 0; background: #0D0E0C; color: #D8D4CB; font-family: Outfit, system-ui, sans-serif; }
        .initial-loader { display: flex; min-height: 100dvh; background: #0D0E0C; }
        .il-rail { display: none; width: 84px; border-right: 1px solid #282923; }
        .il-mark { display: grid; width: 36px; height: 36px; margin: 20px auto; place-items: center; border-radius: 12px; background: #211D14; color: #C7A55B; font-weight: 700; }
        .il-main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; }
        .il-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .il-copy { display: grid; gap: 9px; }
        .il-line, .il-square, .il-cell { background: #171814; animation: il-pulse 1.8s ease-in-out infinite; }
        .il-line { width: 176px; height: 20px; border-radius: 6px; }
        .il-line.short { width: 112px; height: 11px; }
        .il-square { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #282923; }
        .il-ledger { display: grid; border-top: 1px solid #282923; border-bottom: 1px solid #282923; }
        .il-cell { min-height: 144px; padding: 24px; border-top: 1px solid #282923; box-sizing: border-box; }
        .il-cell:first-child { border-top: 0; }
        .il-list { height: 260px; margin-top: 32px; border-top: 1px solid #282923; border-bottom: 1px solid #282923; background: #11120F; animation: il-pulse 1.8s ease-in-out infinite; }
        @media (min-width: 768px) {
          .il-rail { display: block; flex: 0 0 84px; }
          .il-main { padding: 32px; }
          .il-ledger { grid-template-columns: 3fr 5fr 4fr; }
          .il-cell { border-top: 0; border-left: 1px solid #282923; }
          .il-cell:first-child { border-left: 0; }
        }
        @keyframes il-pulse { 50% { background: #1E1F1A; } }
        @media (prefers-reduced-motion: reduce) { .il-line, .il-square, .il-cell, .il-list { animation: none; } }
      </style>
      <div class="initial-loader" role="status" aria-label="Menyiapkan Razchly">
        <aside class="il-rail" aria-hidden="true"><div class="il-mark">R</div></aside>
        <main class="il-main">
          <header class="il-header">
            <div class="il-copy"><span class="il-line"></span><span class="il-line short"></span></div>
            <span class="il-square"></span>
          </header>
          <section class="il-ledger" aria-hidden="true">
            <div class="il-cell"></div>
            <div class="il-cell"></div>
            <div class="il-cell"></div>
          </section>
          <div class="il-list" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
